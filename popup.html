<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LMS Redesign Settings</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body class="is-loading">
  <header class="header" id="popupHeader">
    <div class="header-glow"></div>
    <h1>Bahria LMS Redesign</h1>
    <p>Your learning portal, drawn in ink</p>
  </header>

  <section class="section">
    <h2 class="section-title">Appearance</h2>

    <div class="toggle-row">
      <div class="toggle-copy">
        <span class="toggle-label" id="schemeLabel">Colour Mode</span>
        <p class="toggle-desc" id="schemeDesc">Auto follows your system</p>
      </div>
      <div class="segmented" id="schemeControl" role="radiogroup" aria-labelledby="schemeLabel">
        <button type="button" role="radio" data-scheme="light">Light</button>
        <button type="button" role="radio" data-scheme="dark">Dark</button>
        <button type="button" role="radio" data-scheme="auto">Auto</button>
      </div>
    </div>

    <div class="toggle-row toggle-row--spaced">
      <div class="toggle-copy">
        <label class="toggle-label" for="animeToggle">Anime Style</label>
        <p class="toggle-desc">Inked panels, glass and wallpapers</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="animeToggle">
        <span class="slider" aria-hidden="true"></span>
      </label>
    </div>
  </section>

  <div class="divider"></div>

  <section class="section" id="wallpaperSection">
    <h2 class="section-title" id="wallpaperTitle">Wallpaper</h2>

    <!-- None, the built-in artwork from LmsSettings.WALLPAPERS, then the
         upload slot. Built by popup.js. -->
    <div class="wallpaper-grid" id="wallpaperGrid" role="radiogroup" aria-labelledby="wallpaperTitle"></div>

    <input type="file" id="wallpaperInput" class="visually-hidden" tabindex="-1" aria-hidden="true">

    <div class="wallpaper-controls">
      <button type="button" class="mini-btn mini-btn--primary" id="wallpaperUpload">Upload image</button>
      <label class="mini-select">
        <span class="visually-hidden">Fit</span>
        <select id="wallpaperFit" title="How the image fills the page">
          <option value="cover">Fill</option>
          <option value="contain">Fit</option>
        </select>
      </label>
      <label class="mini-select">
        <span class="visually-hidden">Position</span>
        <select id="wallpaperPos" title="Which part of the image stays in view">
          <option value="center">Centre</option>
          <option value="top">Top</option>
          <option value="bottom">Bottom</option>
          <option value="left">Left</option>
          <option value="right">Right</option>
        </select>
      </label>
    </div>

    <p class="subsection-desc" id="wallpaperNote"></p>
    <p class="subsection-desc" id="wallpaperHint" hidden>Turn on Anime Style to show wallpapers.</p>
  </section>

  <div class="divider"></div>

  <section class="section" id="colorSection">
    <h2 class="section-title" id="colorTitle">Colour</h2>

    <!-- Which of the two colours the wheel edits. The full palette is
         generated from both by LmsSettings.palette(). -->
    <div class="color-targets" role="radiogroup" aria-labelledby="colorTitle">
      <button type="button" class="color-target" role="radio" data-target="main">
        <span class="color-dot" aria-hidden="true"></span>
        <span class="color-target-text">
          <span class="color-target-label">Main</span>
          <span class="color-target-value"></span>
        </span>
      </button>
      <button type="button" class="color-target" role="radio" data-target="accent">
        <span class="color-dot" aria-hidden="true"></span>
        <span class="color-target-text">
          <span class="color-target-label">Highlight</span>
          <span class="color-target-value"></span>
        </span>
      </button>
    </div>

    <div class="color-picker">
      <div class="color-wheel" id="colorWheel" role="slider" tabindex="0"
           aria-label="Colour wheel. Left and right change the hue, up and down the strength.">
        <canvas id="wheelCanvas"></canvas>
        <span class="wheel-handle" id="wheelHandle" aria-hidden="true"></span>
      </div>

      <div class="color-side">
        <label class="color-field" id="shadeField">
          Shade
          <input type="range" id="shadeInput" min="15" max="100" step="1">
        </label>
        <label class="color-field">
          Hex
          <input type="text" id="hexInput" maxlength="7" spellcheck="false" autocomplete="off">
        </label>
        <div class="color-actions">
          <button type="button" class="mini-btn" id="accentAuto" aria-pressed="false"
                  title="Pick a highlight to go with the main colour">Auto</button>
          <button type="button" class="link-btn" id="colorReset">Reset</button>
        </div>
      </div>
    </div>

    <div class="palette-preview" id="palettePreview" aria-hidden="true">
      <span title="Sidebar and header"></span>
      <span title="Buttons"></span>
      <span title="Links"></span>
      <span title="Highlight"></span>
      <span title="Page"></span>
    </div>
    <p class="subsection-desc" id="colorNote">Shades are adjusted where needed so text stays readable in light and dark mode.</p>
  </section>

  <p class="status" id="status" role="status" hidden></p>

  <footer class="popup-footer">
    <span class="shortcut-hint" id="shortcutHint"></span>
    <button type="button" class="link-btn" id="openSettings">Backup &amp; settings</button>
  </footer>

  <script src="js/settings.js"></script>
  <script src="js/wallpaper-upload.js"></script>
  <script src="popup.js"></script>
</body>
</html>
